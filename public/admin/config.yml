# Sveltia CMS configuration.
#
# The fields below must stay in step with the Zod schema in
# src/content.config.ts. If they drift, the CMS will happily save frontmatter
# that fails the next build, and the person who saved it will have no idea why.

backend:
  name: github
  # Moving this repository into an organisation account changes this line,
  # and the OAuth app below has to be re-pointed at the new owner.
  repo: subhachak/oikotaan
  branch: main
  # One-time setup: deploy the sveltia-cms-auth Cloudflare Worker and put its
  # URL here. See README, "Wiring up the content editor".
  base_url: https://YOUR-AUTH-WORKER.workers.dev # still to deploy, see README

# Editors get a preview branch and a pull request instead of committing to main
# directly, which means the same deploy preview the kids use.
publish_mode: editorial_workflow

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home Page
        file: src/content/home.yaml
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { name: kicker, label: Kicker (Bengali script), widget: string }
              - { name: heading, label: Headline, widget: text }
              - { name: description, label: Description, widget: text }
              - {
                  name: image,
                  label: Photo,
                  widget: image,
                  media_folder: public/images/site,
                  public_folder: /images/site,
                }
              - {
                  name: imageAlt,
                  label: Describe the photo for screen readers,
                  widget: string,
                }
          - label: Programs (3 pillars under the hero)
            name: programs
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: icon, label: Icon, widget: select, options: [flame, book, heart] }
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
          - label: Gallery (From our events)
            name: gallery
            widget: list
            summary: "{{fields.alt}}"
            fields:
              - {
                  name: image,
                  label: Photo,
                  widget: image,
                  media_folder: public/images/site,
                  public_folder: /images/site,
                }
              - {
                  name: alt,
                  label: Describe the photo for screen readers,
                  widget: string,
                }
          - label: Contact section
            name: contact
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body text, widget: text }

  - name: events
    label: Events
    label_singular: Event
    folder: src/content/events
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: titleBengali, label: Title in Bengali, widget: string, required: false }
      - {
          name: date,
          label: Date,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: false,
          picker_utc: true,
        }
      - {
          name: endDate,
          label: End date (multi-day events only),
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: false,
          picker_utc: true,
          required: false,
        }
      - {
          name: time,
          label: Time,
          widget: string,
          required: false,
          hint: "Free text, e.g. 6:00 PM onwards",
        }
      - { name: venue, label: Venue, widget: string }
      - { name: address, label: Full address, widget: string, required: false }
      - {
          name: summary,
          label: One-line summary,
          widget: text,
          pattern: ["^.{1,200}$", "Keep this under 200 characters"],
        }
      - { name: image, label: Banner image, widget: image, required: false }
      - {
          name: imageAlt,
          label: Describe the image for screen readers,
          widget: string,
          required: false,
        }
      - { name: ticketUrl, label: Zeffy ticket link, widget: string, required: false }
      - { name: featured, label: Pin to homepage, widget: boolean, default: false }
      - {
          name: draft,
          label: Hide from the site (still writing it),
          widget: boolean,
          default: false,
        }
      - { name: body, label: Details, widget: markdown }
